<style>
  :root{
    --bg: #000000;
    --surface: #0a0a0a;
    --surface-alt: #1a1a1a;
    --line: #2e2e2e;
    --accent: #ffffff;
    --accent-dim: #555555;
    --text: #ffffff;
    --muted: #8a8a8a;
    --success: #4aff4a;
    --error: #ee010d;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #1a1a1a 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    display:flex;
    justify-content:center;
    padding: 48px 20px 80px;
  }

  .wrap{ width:100%; max-width: 560px; }

  header{ text-align:center; margin-bottom: 22px; }

  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 6vw, 44px);
    margin: 0 0 8px;
  }

  .subtitle{
    color: var(--muted);
    font-size: 15px;
    max-width: 420px;
    margin: 0 auto;
    line-height: 1.5;
  }

  .filters{
    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    gap: 8px;
    margin: 22px 0 24px;
  }

  .filter-chip{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .filter-chip:hover{ border-color: var(--accent-dim); color: var(--text); }

  .filter-chip.active{
    background: var(--accent);
    border-color: var(--accent);
    color: #000000;
  }

  .player{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset, 0 24px 60px -30px rgba(0,0,0,0.6);
  }

  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
  }

  .segments{ display:flex; gap:6px; }

  .segment{
    width: 34px;
    height: 8px;
    border-radius: 3px;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .segment.used{ background: var(--accent); border-color: var(--accent); }
  .segment.won{ background: var(--success); border-color: var(--success); }
  .segment.lost{ background: var(--error); border-color: var(--error); }

  .counter{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .deck{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 18px 0 26px;
  }

  .play-btn{
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: transform 0.12s ease, box-shadow 0.2s ease;
    box-shadow: 0 0 0 6px rgba(226,168,62,0.08);
  }

  .play-btn:hover{ transform: scale(1.04); }
  .play-btn:active{ transform: scale(0.97); }
  .play-btn:disabled{ opacity: 0.55; cursor: default; transform:none; }

  .play-btn svg{ margin-left: 3px; }

  .waveform{
    display:flex;
    align-items:flex-end;
    gap: 4px;
    height: 36px;
    margin-top: 20px;
  }

  .waveform span{
    width: 4px;
    border-radius: 2px;
    background: var(--surface-alt);
    height: 8px;
    transition: background 0.2s ease;
  }

  .waveform span.active{
    background: var(--accent);
    animation: bounce 0.9s ease-in-out infinite;
  }

  @keyframes bounce{
    0%, 100% { height: 8px; }
    50% { height: var(--h, 30px); }
  }

  .progress-track{
    width: 100%;
    height: 4px;
    background: var(--surface-alt);
    border-radius: 2px;
    margin-top: 18px;
    overflow: hidden;
  }

  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 2px;
  }

  .status-line{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    margin-top: 12px;
    min-height: 16px;
  }

  form.guess-row{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  input[type="text"]{
    flex: 1;
    background: var(--surface-alt);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }

  input[type="text"]:focus{ border-color: var(--accent); }

  .btn{
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }

  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity: 0.4; cursor: default; }

  .btn-primary{ background: var(--accent); color: #000000; }
  .btn-ghost{ background: transparent; color: var(--muted); border: 1px solid var(--line); }

  .actions-row{ display:flex; gap:8px; }
  .actions-row .btn{ flex:1; }

  .history{ margin-top: 18px; display:flex; flex-direction:column; gap: 6px; }

  .history-item{
    font-size: 13px;
    color: var(--muted);
    display:flex;
    align-items:center;
    gap: 8px;
  }

  .history-item .mark{
    width: 16px;
    text-align:center;
    color: var(--error);
    font-family:'IBM Plex Mono', monospace;
  }

  .result{
    text-align:center;
    padding: 8px 0 4px;
  }

  .result .status{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .result h2{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 28px;
    margin: 0 0 4px;
  }

  .result .by{ color: var(--muted); font-size: 14px; margin-bottom: 18px; }

  .status.win{ color: var(--success); }
  .status.lose{ color: var(--error); }

  .next-btn{ margin-top: 6px; width: 100%; }

  footer{ margin-top: 28px; }

  details{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  details summary{
    cursor: pointer;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  details p{ margin: 10px 0 0; }
  details code{
    background: var(--surface-alt);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }

  .stats{
    display:flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    margin: 18px 0 0;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  .stats b{ color: var(--text); font-size: 15px; display:block; font-family:'IBM Plex Sans', sans-serif; }

  @media (prefers-reduced-motion: reduce){
    .waveform span.active{ animation: none; height: 18px; }
  }
</style>

<div class="wrap">

  <header>
    <h1 id="gameTitle">GACETALESS</h1>
    <p class="subtitle" id="gameSubtitle">Escuchá el fragmento y adiviná la canción.</p>
  </header>

  <div class="filters" id="filters"></div>

  <div class="player">
    <div class="progress-row">
      <div class="counter time-left" id="timeLeft">0,1s</div>
      <div class="segments" id="segments"></div>
      <div class="counter" id="counter">0 / 5</div>
    </div>

    <div class="deck">
      <button class="play-btn" id="playBtn" aria-label="Reproducir fragmento">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#000000"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="waveform" id="waveform"></div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="status-line" id="statusLine"></div>
    </div>

    <form class="guess-row" id="guessForm" autocomplete="off">
      <input type="text" id="guessInput" list="songList" placeholder="Título de la canción..." />
      <datalist id="songList"></datalist>
      <button type="submit" class="btn btn-primary" id="submitBtn">Adivinar</button>
    </form>

    <div class="actions-row">
      <button class="btn btn-ghost" id="skipBtn">Saltar intento</button>
      <button class="btn btn-ghost" id="giveUpBtn">Rendirme</button>
    </div>

    <div class="history" id="history"></div>

    <div class="result" id="result" style="display:none;">
      <div class="status" id="resultStatus"></div>
      <h2 id="resultTitle"></h2>
      <div class="by" id="resultArtist"></div>
      <button class="btn btn-primary next-btn" id="nextBtn">Siguiente canción</button>
    </div>
  </div>

  <div class="stats">
    <div><b id="statPlayed">0</b>jugadas</div>
    <div><b id="statWon">0</b>acertadas</div>
    <div><b id="statAvg">–</b>intento promedio</div>
    <div><b id="statStreak">0</b>racha</div>
    <div><b id="statBestStreak">0</b>racha más alta</div>
  </div>

</div>

/* Duración del fragmento (en segundos) que se desbloquea en cada intento */
const REVEAL_TIMES = [0.1, 0.5, 3, 6, 10];
const MAX_ATTEMPTS = REVEAL_TIMES.length;

/* ========================================================= */

const audio = new Audio();

let activeList = SONGS.slice();
let activeFilter = "Todos";
let currentSong = null;
let attemptsUsed = 0;
let roundOver = false;
let recentIndexes = [];
let roundOffset = 0;

let stats = { played: 0, won: 0, attemptsOnWin: [], streak: 0, bestStreak: 0 };

const el = (id) => document.getElementById(id);

function formatTime(seconds){
  return String(seconds).replace('.', ',') + 's';
}

function escapeRegex(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function songMatchesArtist(song, name){
  return new RegExp(`\\b${escapeRegex(name)}`, 'i').test(song.artist);
}

function normalize(str){
  return str
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function isCorrectGuess(guess, title){
  const g = normalize(guess);
  const t = normalize(title);
  if(!g) return false;
  if(g === t) return true;
  const maxDist = Math.max(1, Math.floor(t.length * 0.12));
  return levenshtein(g, t) <= maxDist;
}

/* ---------- UI builders ---------- */
function buildSegments(){
  const wrap = el('segments');
  wrap.innerHTML = '';
  for(let i=0;i<MAX_ATTEMPTS;i++){
    const s = document.createElement('div');
    s.className = 'segment';
    wrap.appendChild(s);
  }
}

function buildWaveform(){
  const wrap = el('waveform');
  wrap.innerHTML = '';
  const bars = 24;
  for(let i=0;i<bars;i++){
    const span = document.createElement('span');
    const h = 10 + Math.round(Math.random()*26);
    span.style.setProperty('--h', h + 'px');
    wrap.appendChild(span);
  }
}

function setWaveformActive(active){
  document.querySelectorAll('.waveform span').forEach((s) => {
    s.classList.toggle('active', active);
    if(active) s.style.animationDelay = (Math.random()*0.6) + 's';
  });
}

function refreshSegmentsUI(){
  const segs = document.querySelectorAll('.segment');
  segs.forEach((s, i) => {
    s.classList.remove('used','won','lost');
    if(i < attemptsUsed) s.classList.add('used');
  });
  el('counter').textContent = `${attemptsUsed} / ${MAX_ATTEMPTS}`;
}

function updateSongList(){
  const artists = new Set(activeList.map(s => s.artist));
  const showArtist = artists.size > 1;
  const list = el('songList');
  list.innerHTML = '';
  activeList.forEach(s => {
    const opt = document.createElement('option');
    opt.value = showArtist ? `${s.title} — ${s.artist}` : s.title;
    list.appendChild(opt);
  });
}

function buildFilters(){
  const wrap = el('filters');
  wrap.innerHTML = '';

  const makeChip = (label) => {
    const chip = document.createElement('button');
    chip.className = 'filter-chip' + (label === activeFilter ? ' active' : '');
    chip.textContent = label;
    chip.addEventListener('click', () => {
      activeFilter = label;
      activeList = label === 'Todos' ? SONGS.slice() : SONGS.filter(s => songMatchesArtist(s, label));
      recentIndexes = [];
      buildFilters();
      updateSongList();
      startRound();
    });
    wrap.appendChild(chip);
  };

  makeChip('Todos');
  CORE_ARTISTS.forEach(makeChip);
}

/* ---------- Game flow ---------- */
function pickIndex(){
  if(activeList.length === 1) return 0;
  let idx;
  do { idx = Math.floor(Math.random()*activeList.length); }
  while(recentIndexes.includes(idx) && recentIndexes.length < activeList.length);
  recentIndexes.push(idx);
  if(recentIndexes.length > Math.min(3, activeList.length-1)) recentIndexes.shift();
  return idx;
}

async function startRound(){
  if(!activeList.length){
    el('statusLine').textContent = 'No hay canciones para este filtro todavía.';
    return;
  }

  roundOver = true; // locks input while we load
  el('guessForm').style.display = 'flex';
  document.querySelector('.actions-row').style.display = 'flex';
  el('result').style.display = 'none';
  el('guessInput').value = '';
  el('guessInput').disabled = true;
  el('submitBtn').disabled = true;
  el('skipBtn').disabled = true;
  el('giveUpBtn').disabled = true;
  el('playBtn').disabled = true;
  el('history').innerHTML = '';
  el('timeLeft').textContent = formatTime(REVEAL_TIMES[0]);
  el('statusLine').textContent = 'Cargando...';
  el('progressFill').style.width = '0%';
  buildSegments();
  attemptsUsed = 0;
  refreshSegmentsUI();

  const idx = pickIndex();
  const song = activeList[idx];
  currentSong = song;

  audio.pause();
  audio.onended = null;
  audio.src = song.audioUrl;

  const maxReveal = REVEAL_TIMES[REVEAL_TIMES.length - 1];
  const ready = () => new Promise((resolve) => {
    if(audio.readyState >= 1 && audio.duration){ resolve(audio.duration); return; }
    const onLoaded = () => { audio.removeEventListener('loadedmetadata', onLoaded); resolve(audio.duration || 29); };
    audio.addEventListener('loadedmetadata', onLoaded);
    setTimeout(() => resolve(audio.duration || 29), 4000);
  });

  const duration = await ready();
  const usableDuration = Math.max(duration - maxReveal, 0);
  roundOffset = usableDuration > 0 ? Math.random() * usableDuration : 0;

  roundOver = false;
  el('statusLine').textContent = '';
  el('guessInput').disabled = false;
  el('submitBtn').disabled = false;
  el('skipBtn').disabled = false;
  el('giveUpBtn').disabled = false;
  el('playBtn').disabled = false;
  el('playBtn').onclick = () => { if(!roundOver) playSnippet(); };
  el('guessInput').focus();
}

let playTimeout = null;
let progressStart = 0;
let progressWindow = 1;

function setProgress(fraction){
  const pct = Math.min(1, Math.max(0, fraction)) * 100;
  el('progressFill').style.width = pct + '%';
}

audio.addEventListener('timeupdate', () => {
  setProgress((audio.currentTime - progressStart) / progressWindow);
});

function playSnippet(){
  if(playTimeout) clearTimeout(playTimeout);
  const allowed = REVEAL_TIMES[Math.min(attemptsUsed, MAX_ATTEMPTS-1)];
  audio.currentTime = roundOffset;
  progressStart = roundOffset;
  progressWindow = allowed;
  setProgress(0);
  el('playBtn').disabled = true;
  setWaveformActive(true);
  audio.play().catch(() => {
    el('playBtn').disabled = false;
    setWaveformActive(false);
  });
  playTimeout = setTimeout(() => {
    audio.pause();
    el('playBtn').disabled = false;
    setWaveformActive(false);
    setProgress(0);
  }, allowed * 1000);
}

function playFull(){
  if(playTimeout) clearTimeout(playTimeout);
  audio.currentTime = 0;
  progressStart = 0;
  progressWindow = audio.duration || 1;
  setProgress(0);
  setWaveformActive(true);
  audio.play().catch(()=>{});
  audio.onended = () => { setWaveformActive(false); setProgress(0); };
}

function addHistoryItem(text){
  const row = document.createElement('div');
  row.className = 'history-item';
  row.innerHTML = `<span class="mark">✗</span><span>${text}</span>`;
  el('history').prepend(row);
}

function endRound(won){
  roundOver = true;
  audio.pause();
  if(playTimeout) clearTimeout(playTimeout);
  setWaveformActive(false);

  stats.played++;
  if(won){
    stats.won++;
    stats.attemptsOnWin.push(attemptsUsed + 1);
    stats.streak++;
    stats.bestStreak = Math.max(stats.bestStreak, stats.streak);
  } else {
    stats.streak = 0;
  }
  updateStatsUI();

  const segs = document.querySelectorAll('.segment');
  segs.forEach((s, i) => {
    s.classList.remove('used');
    if(won && i <= attemptsUsed) s.classList.add('won');
    else if(!won) s.classList.add('lost');
  });

  el('guessForm').style.display = 'none';
  document.querySelector('.actions-row').style.display = 'none';

  el('result').style.display = 'block';
  el('resultStatus').textContent = won ? `ACERTASTE EN ${attemptsUsed+1}/${MAX_ATTEMPTS}` : 'NO ERA ESTA VEZ';
  el('resultStatus').className = 'status ' + (won ? 'win' : 'lose');
  el('resultTitle').textContent = currentSong.title;
  el('resultArtist').textContent = currentSong.artist;

  el('playBtn').onclick = playFull;
  el('playBtn').disabled = false;
  el('timeLeft').textContent = 'Completa';
}

function updateStatsUI(){
  el('statPlayed').textContent = stats.played;
  el('statWon').textContent = stats.won;
  if(stats.attemptsOnWin.length){
    const avg = stats.attemptsOnWin.reduce((a,b)=>a+b,0) / stats.attemptsOnWin.length;
    el('statAvg').textContent = avg.toFixed(1).replace('.', ',');
  } else {
    el('statAvg').textContent = '–';
  }
  el('statStreak').textContent = stats.streak;
  el('statBestStreak').textContent = stats.bestStreak;
}

function handleGuess(rawGuess){
  if(roundOver) return;
  const cleanGuess = rawGuess.split('—')[0].trim();

  if(isCorrectGuess(cleanGuess, currentSong.title)){
    endRound(true);
    return;
  }

  addHistoryItem(rawGuess || '(saltado)');
  attemptsUsed++;
  refreshSegmentsUI();

  if(attemptsUsed >= MAX_ATTEMPTS){
    endRound(false);
  } else {
    el('timeLeft').textContent = formatTime(REVEAL_TIMES[attemptsUsed]);
    el('guessInput').value = '';
    el('guessInput').focus();
  }
}

/* Events */
el('guessForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const val = el('guessInput').value.trim();
  if(!val) return;
  handleGuess(val);
});

el('skipBtn').addEventListener('click', () => handleGuess(''));
el('giveUpBtn').addEventListener('click', () => { if(!roundOver) endRound(false); });
el('nextBtn').addEventListener('click', startRound);

/* Init */
el('gameTitle').textContent = GAME_TITLE;
buildWaveform();
buildFilters();
updateSongList();
startRound();
</script>
